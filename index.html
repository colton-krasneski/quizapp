<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizApp | Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="shapes" aria-hidden="true">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <main class="card">

    <div class="brand">
      <h1>Quiz<span>App</span></h1>
      <p>Play quiz games with your class</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Log In</button>
      <button class="tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">Sign Up</button>
    </div>

    <p class="msg msg-error" id="message" role="alert" hidden></p>

    <!-- Log in -->
    <form id="form-login" role="tabpanel" aria-labelledby="tab-login">
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Log In</button>
    </form>

    <!-- Sign up -->
    <form id="form-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
      <div class="field">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-green">Create Account</button>
    </form>

    <div class="divider">or</div>

    <button class="btn btn-ghost" id="guest">Play as Guest</button>

    <p class="note">
      Accounts are saved in this browser only.<br>
      Don't reuse a password from another site.
    </p>

  </main>

  <script type="module">
    import { signUp, logIn, playAsGuest, currentUser } from "./js/auth.js";

    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const formLogin = document.getElementById("form-login");
    const formSignup = document.getElementById("form-signup");
    const message = document.getElementById("message");

    // Already signed in? Skip straight to the dashboard.
    if (currentUser()) location.replace("home.html");

    function showMessage(text, kind = "error") {
      message.textContent = text;
      message.className = "msg msg-" + (kind === "ok" ? "ok" : "error");
      message.hidden = false;
    }

    function clearMessage() {
      message.hidden = true;
    }

    function selectTab(which) {
      const login = which === "login";
      tabLogin.setAttribute("aria-selected", String(login));
      tabSignup.setAttribute("aria-selected", String(!login));
      formLogin.hidden = !login;
      formSignup.hidden = login;
      clearMessage();
    }

    tabLogin.addEventListener("click", () => selectTab("login"));
    tabSignup.addEventListener("click", () => selectTab("signup"));

    // Wraps a submit handler so the button locks while it runs
    // and any thrown message lands in the message bar.
    function handle(form, action) {
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const button = form.querySelector("button[type=submit]");
        button.disabled = true;

        try {
          await action(new FormData(form));
          location.href = "home.html";
        } catch (error) {
          showMessage(error.message);
          button.disabled = false;
        }
      });
    }

    handle(formLogin, (data) =>
      logIn(data.get("username"), data.get("password"))
    );

    handle(formSignup, (data) =>
      signUp(data.get("username"), data.get("password"), data.get("confirm"))
    );

    document.getElementById("guest").addEventListener("click", () => {
      playAsGuest();
      location.href = "home.html";
    });
  </script>

</body>
</html>
